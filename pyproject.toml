[build-system]
requires = ["setuptools>=77"]   # PEP 639: `license` as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
# The distribution is `codmap`; the command, the import and the repository stay `codemap`
# (that name was already taken on PyPI). `codemap/provenance.py` keeps the two apart —
# TOOL_NAME is the identity written into every graph, DIST_NAME is what is looked up for a
# version. README says this plainly, since `pip install codmap` / `import codemap` is a
# seam a reader will otherwise hit by surprise.
name = "codmap"
version = "0.0.6"
description = "Static analyzer that turns a package's source into a queryable code graph."
readme = "README.md"
# M20/D1: measured, not assumed. Each release of the declared range runs the full suite in
# CI (.github/workflows/ci.yml). 3.10 is excluded on purpose: `tomllib` is stdlib only from
# 3.11, and buying it back with a `tomli` dependency would spend one of exactly three
# runtime dependencies on an interpreter whose upstream support ends in October 2026.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kogriv", email = "kogriv@gmail.com" }]
keywords = [
    "static-analysis", "code-graph", "call-graph", "dependency-graph",
    "code-intelligence", "ast", "griffe", "mcp", "rag", "scip",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "griffe>=2.0",     # structure: API surface, imports, inherits, exports (fast tier)
    "networkx>=3.0",   # query backend (graph algorithms)
    "jedi>=0.19",      # deep call resolution: local-variable type inference (--deep tier)
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]     # `codemap serve --mcp`: expose ops as MCP tools (optional)
scip = ["protobuf>=5.26"]  # `codemap export scip`: SCIP index for interop (optional, R1-C1)

[project.urls]
Homepage = "https://github.com/kogriv/codemap"
Source = "https://github.com/kogriv/codemap"
Issues = "https://github.com/kogriv/codemap/issues"
Changelog = "https://github.com/kogriv/codemap/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kogriv/codemap/tree/main/docs"

[project.scripts]
codemap = "codemap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codemap*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
# Packages under tests/fixtures are *inputs* to the extractor, not tests. One of them
# (tmworld, R1-C24) deliberately contains a file pytest would otherwise collect, because
# the test-mapping rule keys on that same collection convention.
norecursedirs = ["tests/fixtures"]
# Four test modules do `from tests.frozen import frozen`, which needs the repo root on
# sys.path. `python -m pytest` puts it there and plain `pytest` does not — so the suite
# passed the way CONTRIBUTING documents it and failed the way most people type it. CI
# found that on its first run (M20); stating it here makes both invocations work.
pythonpath = ["."]
