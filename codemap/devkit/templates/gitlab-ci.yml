# codemap-devkit:ci v{{devkit_version}} — managed by the codemap devkit; add to .gitlab-ci.yml:
#   include: { local: .gitlab/codemap-ci.yml }
# The pin (codmap=={{codemap_version}}) is this project's decision.
codemap-architecture:
  image: python:3.12-slim
  script:
    - pip install "codmap=={{codemap_version}}"
    - codemap build {{package_sh}} -o {{graph_sh}}
    - codemap check --graph {{graph_sh}} --root . --require-contract
