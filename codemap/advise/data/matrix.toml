[meta]
schema = 1
as_of = "2026-11-21"
stale_after_days = 180
repo = "https://github.com/kogriv/codemap"

[[need]]
id = "py-symbols"
title = "Where a Python symbol is defined, and its dossier"
keywords = ["definition", "where", "defined", "symbol", "dossier", "signature", "find", "lookup", "goto"]
languages = ["python"]
codemap = "covered"
codemap_how = "MCP `search`, `query`, `resolve`, `source`; CLI `codemap query <symbol>`"
codemap_tests = ["tests/test_m1_query.py::test_where_defined_resolves_reexport", "tests/test_m17_mcp.py::test_query_tool_dossier"]

[[need]]
id = "py-callers"
title = "Who calls a Python function, and what it calls"
keywords = ["callers", "callees", "call", "calls", "graph", "who", "uses", "usage", "references"]
languages = ["python"]
codemap = "covered"
codemap_how = "MCP `callers`, `callees`; CLI `codemap query <symbol>` (both lists in the dossier)"
codemap_tests = ["tests/test_m4_behavior.py::test_callers_of_flagship", "tests/test_epistemic.py::test_callers_partial"]
codemap_caveat = "Calls through a string (a registry keyed by name, `run(\"name\")`) are not resolved (R1-C107); dynamic dispatch is reported as partial, never as complete."

[[need]]
id = "py-impact"
title = "What a change to a Python symbol touches (blast radius)"
keywords = ["impact", "blast", "radius", "change", "break", "affected", "dependents", "refactor", "safe"]
languages = ["python"]
codemap = "covered"
codemap_how = "MCP `impact`; CLI `codemap report impact --symbol <symbol> [--depth N]`"
codemap_tests = ["tests/test_impact_depth.py::test_depth_limits_the_bfs", "tests/test_impact_depth.py::test_cli_report_impact_depth_flag"]

[[need]]
id = "py-imports"
title = "Python import graph and import cycles"
keywords = ["imports", "import", "dependencies", "cycles", "cycle", "circular", "modules", "graph"]
languages = ["python"]
codemap = "covered"
codemap_how = "CLI `codemap report dependencies`; MCP `report kind=dependencies`, `architecture`"
codemap_tests = ["tests/test_m1_query.py::test_import_edges_resolved", "tests/test_m1_query.py::test_cycle_detection"]

[[need]]
id = "import-gate"
title = "An architecture contract on imports, enforced in CI"
keywords = ["gate", "contract", "layers", "forbidden", "architecture", "ci", "enforce", "lint", "import", "ratchet", "boundaries"]
languages = ["python"]
codemap = "covered"
codemap_how = "`[architecture]` in codemap.toml; CLI `codemap check --require-contract`; MCP `check`"
codemap_tests = ["tests/test_r1c37_rule_mutation.py::test_forbidden_catches_the_banned_direction_only", "tests/test_r1c37_rule_mutation.py::test_no_cycles_catches_a_cycle_the_import_actually_closes"]

[[need]]
id = "py-tests-for"
title = "Which tests exercise a Python symbol"
keywords = ["tests", "test", "coverage", "covers", "exercise", "untested"]
languages = ["python"]
codemap = "partial"
codemap_how = "MCP `tests`, `covers`; CLI `codemap tests <symbol>` — on a repo-scoped graph (`build --consumer tests --mode full`)"
codemap_tests = ["tests/test_r1c24_test_mapping.py::test_only_real_pytest_tests_are_tests"]
codemap_caveat = "Static reach, not runtime coverage; tests that reach code through dispatch by name are missed (R1-C107). For line coverage use coverage.py."

